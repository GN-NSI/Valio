<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ══════════════════════════════════════════════════════
   VARIABLES & RESET
══════════════════════════════════════════════════════ */
:root {
  --bg:      #080811;
  --bg2:     #0d0d1a;
  --card:    #111120;
  --card2:   #18182a;
  --border:  #1e1e35;
  --border2: #2a2a45;
  --text:    #e8e8f5;
  --muted:   #6b6b8a;
  --muted2:  #3d3d5c;
  --blue:    #5b7ef5;
  --blue2:   #3a5ce4;
  --green:   #22c55e;
  --green2:  #16a34a;
  --red:     #ef4444;
  --yellow:  #f59e0b;
  --purple:  #8b5cf6;
  --font:    'Inter', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; }
input, select, button, textarea { font-family:var(--font); }
a { color:var(--blue); text-decoration:none; }

/* ══════════════════════════════════════════════════════
   AUTH SCREEN
══════════════════════════════════════════════════════ */
#auth-screen {
  min-height:100vh; display:flex;
  align-items:center; justify-content:center;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(91,126,245,.2) 0%, transparent 60%);
}
.auth-box {
  width:420px; background:var(--card);
  border:1px solid var(--border2); border-radius:20px; padding:40px;
}
.auth-logo { text-align:center; margin-bottom:32px; }
.auth-logo .mark {
  width:52px; height:52px;
  background:linear-gradient(135deg, var(--blue), var(--purple));
  border-radius:14px; display:inline-flex;
  align-items:center; justify-content:center;
  font-size:24px; font-weight:800; color:#fff; margin-bottom:14px;
  box-shadow:0 8px 30px rgba(91,126,245,.35);
}
.auth-logo h1 { font-size:24px; font-weight:700; letter-spacing:-.3px; }
.auth-logo p  { font-size:13px; color:var(--muted); margin-top:4px; }

.auth-tabs { display:flex; margin-bottom:28px; border-bottom:1px solid var(--border); }
.auth-tab {
  flex:1; text-align:center; padding:10px 0; cursor:pointer;
  font-size:14px; font-weight:500; color:var(--muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s;
}
.auth-tab.active { color:var(--blue); border-bottom-color:var(--blue); }

.auth-error {
  background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
  border-radius:8px; padding:10px 14px; font-size:13px; color:var(--red);
  margin-bottom:16px; display:none;
}

/* ══════════════════════════════════════════════════════
   FORMS & BUTTONS
══════════════════════════════════════════════════════ */
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:6px; }
.form-input {
  width:100%; background:var(--bg2); border:1px solid var(--border);
  border-radius:9px; padding:10px 14px; color:var(--text);
  font-size:14px; outline:none; transition:border-color .15s;
  -webkit-appearance:none;
}
.form-input:focus { border-color:var(--blue); }
.form-input::placeholder { color:var(--muted2); }
select.form-input { cursor:pointer; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 18px; border-radius:9px; border:none;
  cursor:pointer; font-size:14px; font-weight:500; transition:all .15s;
}
.btn-primary { background:var(--blue2); color:#fff; }
.btn-primary:hover { background:var(--blue); }
.btn-primary:disabled { opacity:.55; cursor:not-allowed; }
.btn-ghost { background:var(--card2); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { border-color:var(--border2); background:var(--card); }
.btn-danger { background:rgba(239,68,68,.12); color:var(--red); border:1px solid rgba(239,68,68,.25); }
.btn-danger:hover { background:rgba(239,68,68,.22); }
.btn-full { width:100%; }
.btn-sm { padding:5px 12px; font-size:12px; border-radius:7px; }

/* ══════════════════════════════════════════════════════
   APP LAYOUT
══════════════════════════════════════════════════════ */
#app-screen { display:none; height:100vh; overflow:hidden; }
.app-layout { display:flex; height:100vh; }

/* SIDEBAR */
#sidebar {
  width:224px; flex-shrink:0;
  background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100vh;
}
.sidebar-logo {
  padding:20px 18px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:11px;
}
.sidebar-logo .mark {
  width:34px; height:34px;
  background:linear-gradient(135deg, var(--blue), var(--purple));
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:#fff; flex-shrink:0;
}
.sidebar-logo .name { font-size:18px; font-weight:700; letter-spacing:-.2px; }

nav { flex:1; padding:10px 8px; overflow-y:auto; }
.nav-section {
  font-size:10px; font-weight:600; text-transform:uppercase;
  letter-spacing:.1em; color:var(--muted2); padding:14px 10px 5px;
}
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:9px; cursor:pointer;
  font-size:13.5px; font-weight:500; color:var(--muted);
  transition:all .12s; margin-bottom:1px; position:relative;
}
.nav-item:hover:not(.disabled) { background:var(--card); color:var(--text); }
.nav-item.active { background:rgba(91,126,245,.14); color:var(--blue); font-weight:600; }
.nav-item.disabled { opacity:.35; cursor:default; }
.nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.nav-soon {
  font-size:9px; background:var(--card2); color:var(--muted2);
  padding:2px 6px; border-radius:4px; margin-left:auto; font-weight:600;
}

.sidebar-footer {
  padding:16px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:10px; cursor:pointer;
  transition:background .12s;
}
.sidebar-footer:hover { background:var(--card); }
.avatar {
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; flex-shrink:0;
  background:rgba(91,126,245,.18); color:var(--blue);
}
.sidebar-user .uname { font-size:13px; font-weight:600; }
.sidebar-user .logout { font-size:11px; color:var(--muted); margin-top:1px; }

/* MAIN */
#main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
#topbar {
  height:56px; flex-shrink:0; background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 28px; gap:12px;
}
.topbar-title { font-size:16px; font-weight:700; flex:1; }
#page { flex:1; overflow-y:auto; padding:28px; }

/* ══════════════════════════════════════════════════════
   COMPONENTS
══════════════════════════════════════════════════════ */
.card { background:var(--card); border:1px solid var(--border); border-radius:13px; }

/* KPI GRID */
.kpi-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:22px; }
.kpi-card { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:22px; }
.kpi-label { font-size:12px; font-weight:500; color:var(--muted); margin-bottom:10px; }
.kpi-value { font-size:26px; font-weight:700; line-height:1.1; margin-bottom:8px; }
.kpi-sub { font-size:12px; color:var(--muted); }

.badge {
  display:inline-flex; align-items:center; gap:3px;
  padding:4px 9px; border-radius:20px; font-size:12px; font-weight:600;
}
.badge-green  { background:rgba(34,197,94,.14); color:var(--green); }
.badge-red    { background:rgba(239,68,68,.14);  color:var(--red);   }
.badge-blue   { background:rgba(91,126,245,.14); color:var(--blue);  }
.badge-muted  { background:var(--card2); color:var(--muted); }

/* TABLE */
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th {
  padding:10px 16px; text-align:right;
  font-size:11px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
thead th:first-child { text-align:left; }
tbody tr { border-bottom:1px solid var(--border); transition:background .08s; }
tbody tr:hover { background:var(--bg2); }
tbody tr:last-child { border-bottom:none; }
td { padding:13px 16px; text-align:right; vertical-align:middle; }
td:first-child { text-align:left; }

.ticker-cell { display:flex; align-items:center; gap:11px; }
.ticker-logo {
  width:34px; height:34px; border-radius:9px;
  background:var(--card2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--muted);
  flex-shrink:0; overflow:hidden;
}
.ticker-logo img { width:100%; height:100%; object-fit:cover; border-radius:8px; }
.ticker-name { font-weight:600; font-size:14px; }
.ticker-sym  { font-size:11px; color:var(--muted); margin-top:1px; font-family:monospace; }
.mono { font-family:'JetBrains Mono','Fira Code',monospace; }

/* 2-col grid */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.chart-wrap { position:relative; height:210px; }

/* SECTION HEADER */
.section-hd {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.section-hd h3 { font-size:15px; font-weight:600; }

/* ACCOUNT CARD */
.account-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:13px; margin-bottom:16px; overflow:hidden;
}
.account-header {
  display:flex; align-items:center; gap:12px;
  padding:18px 20px; border-bottom:1px solid var(--border);
}
.account-icon {
  width:40px; height:40px; border-radius:10px;
  background:rgba(91,126,245,.14); color:var(--blue);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
.type-badge {
  padding:3px 8px; border-radius:5px; font-size:11px; font-weight:700;
  background:var(--card2); color:var(--muted); letter-spacing:.05em;
}

/* MODAL */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  z-index:200; display:none; align-items:center; justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--card); border:1px solid var(--border2);
  border-radius:18px; padding:28px;
  width:520px; max-width:95vw; max-height:90vh; overflow-y:auto;
}
.modal-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.modal-hd h2 { font-size:17px; font-weight:700; }
.modal-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:2px 6px; border-radius:4px; }
.modal-close:hover { background:var(--card2); }
.modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }

/* TX TOTAL BOX */
.tx-total-box {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:9px; padding:12px 16px; margin-bottom:16px;
  font-size:13px; color:var(--muted);
}
.tx-total-box strong { color:var(--text); }

/* ACCT TAG */
.acct-tag {
  display:inline-flex; padding:2px 7px; border-radius:4px;
  font-size:10px; font-weight:600; font-family:monospace;
  background:rgba(91,126,245,.12); color:var(--blue);
  margin:1px;
}

/* EMPTY STATE */
.empty-state { text-align:center; padding:70px 20px; }
.empty-state .icon { font-size:52px; margin-bottom:16px; }
.empty-state h3 { font-size:18px; font-weight:700; margin-bottom:8px; }
.empty-state p { font-size:14px; color:var(--muted); margin-bottom:24px; }

/* LOADING */
.shimmer {
  background:linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite; border-radius:5px; display:inline-block;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.spinner {
  width:18px; height:18px; border:2px solid var(--border);
  border-top-color:var(--blue); border-radius:50%;
  animation:spin .7s linear infinite; display:inline-block;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* TOAST */
.toast {
  position:fixed; bottom:24px; right:24px;
  background:var(--card2); border:1px solid var(--border2);
  border-radius:10px; padding:12px 18px; font-size:13px; font-weight:500;
  z-index:999; animation:slideUp .25s ease;
  display:flex; align-items:center; gap:8px; max-width:340px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
@keyframes slideUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }

/* REFRESH BTN */
.refresh-btn { color:var(--muted); background:none; border:1px solid var(--border); }
.refresh-btn:hover { color:var(--text); background:var(--card); }

/* COLORS */
.c-green { color:var(--green) !important; }
.c-red   { color:var(--red) !important; }
.c-muted { color:var(--muted) !important; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     AUTH SCREEN
══════════════════════════════════════════════════════ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="mark">F</div>
      <h1>Folio</h1>
      <p>Suivi de portefeuille personnel</p>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Connexion</div>
      <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Inscription</div>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="auth-email" class="form-input" placeholder="vous@email.com"
             onkeydown="if(event.key==='Enter') handleAuth()">
    </div>
    <div id="signup-name-group" class="form-group" style="display:none">
      <label class="form-label">Nom d'affichage</label>
      <input type="text" id="auth-displayname" class="form-input" placeholder="ex: Nathan"
             onkeydown="if(event.key==='Enter') handleAuth()">
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <input type="password" id="auth-password" class="form-input" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') handleAuth()">
    </div>
    <button class="btn btn-primary btn-full" id="auth-btn" onclick="handleAuth()">Se connecter</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     APP
══════════════════════════════════════════════════════ -->
<div id="app-screen">
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-logo">
        <div class="mark">F</div>
        <span class="name">Folio</span>
      </div>
      <nav>
        <div class="nav-item active" id="nav-portfolio" onclick="navigate('portfolio')">
          <span class="nav-icon">📊</span><span>Portefeuille</span>
        </div>
        <div class="nav-item" id="nav-accounts" onclick="navigate('accounts')">
          <span class="nav-icon">💳</span><span>Comptes</span>
        </div>
        <div class="nav-section">Analyse</div>
        <div class="nav-item disabled">
          <span class="nav-icon">🔍</span><span>Screener</span><span class="nav-soon">BIENTÔT</span>
        </div>
        <div class="nav-item disabled">
          <span class="nav-icon">⭐</span><span>Watchlist</span><span class="nav-soon">BIENTÔT</span>
        </div>
        <div class="nav-item disabled">
          <span class="nav-icon">📓</span><span>Journal</span><span class="nav-soon">BIENTÔT</span>
        </div>
        <div class="nav-section">Social</div>
        <div class="nav-item disabled">
          <span class="nav-icon">👥</span><span>Amis</span><span class="nav-soon">BIENTÔT</span>
        </div>
      </nav>
      <div class="sidebar-footer" onclick="logout()">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div class="sidebar-user">
          <div class="uname" id="sidebar-username">—</div>
          <div class="logout">Se déconnecter</div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div id="main">
      <div id="topbar">
        <span class="topbar-title" id="page-title">Portefeuille</span>
        <span id="eurusd-rate" style="font-size:12px;color:var(--muted)"></span>
        <button class="btn btn-ghost btn-sm refresh-btn" onclick="refreshData()" title="Actualiser les prix">↻ Actualiser</button>
      </div>
      <div id="page"></div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-content"></div>
</div>

<!-- ══════════════════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════════════════ -->
<script>
// ── CONFIG ───────────────────────────────────────────────────
const SUPABASE_URL = 'https://dnmibojfzquicbhtactx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Wn3itCQXPfm-Onwey7h7Uw_pa2foE-f';
const API          = '/api/quote';

const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── STATE ────────────────────────────────────────────────────
const S = {
  user:         null,
  profile:      null,
  accounts:     [],
  transactions: [],
  prices:       {},
  eurUsd:       1.08,   // 1 EUR = X USD
  page:         'portfolio',
  chart:        null,
  loading:      false
};

// ── AUTH ─────────────────────────────────────────────────────
let authMode = 'login';

function switchTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('signup-name-group').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('auth-btn').textContent = mode === 'login' ? 'Se connecter' : "S'inscrire";
  hideAuthError();
}

async function handleAuth() {
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn      = document.getElementById('auth-btn');
  if (!email || !password) return showAuthError('Remplis tous les champs');

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  hideAuthError();

  try {
    if (authMode === 'signup') {
      const displayName = document.getElementById('auth-displayname').value.trim();
      const { error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      // Update display name after short delay (trigger needs time)
      if (displayName) {
        await new Promise(r => setTimeout(r, 1200));
        await db.from('profiles').update({ display_name: displayName }).eq('id', (await db.auth.getUser()).data.user?.id);
      }
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch(err) {
    showAuthError(authErr(err.message));
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? 'Se connecter' : "S'inscrire";
  }
}

function authErr(m) {
  if (m.includes('Invalid login'))       return 'Email ou mot de passe incorrect';
  if (m.includes('Email not confirmed')) return 'Confirme ton email avant de te connecter';
  if (m.includes('already registered'))  return 'Cet email est déjà utilisé';
  if (m.includes('Password'))            return 'Mot de passe trop court (min. 6 caractères)';
  return m;
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}
function hideAuthError() { document.getElementById('auth-error').style.display = 'none'; }

async function logout() {
  await db.auth.signOut();
}

// ── AUTH STATE LISTENER ──────────────────────────────────────
db.auth.onAuthStateChange(async (_event, session) => {
  if (session?.user) {
    S.user = session.user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    await bootstrap();
    navigate('portfolio');
  } else {
    S.user = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

// ── BOOTSTRAP ────────────────────────────────────────────────
async function bootstrap() {
  // Profile
  const { data: p } = await db.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = p;
  if (p) {
    const name = p.display_name || p.username || S.user.email.split('@')[0];
    document.getElementById('sidebar-username').textContent = name;
    document.getElementById('sidebar-avatar').textContent   = name[0].toUpperCase();
  }

  // Accounts
  const { data: accts } = await db.from('accounts')
    .select('*').eq('user_id', S.user.id).order('created_at');
  S.accounts = accts || [];

  // Transactions (avec le nom du compte)
  if (S.accounts.length > 0) {
    const ids = S.accounts.map(a => a.id);
    const { data: txs } = await db.from('transactions')
      .select('*, accounts(name, type)')
      .in('account_id', ids)
      .order('transaction_date', { ascending: false });
    S.transactions = txs || [];
  } else {
    S.transactions = [];
  }

  // EUR/USD rate
  await fetchEurUsd();
}

// ── POSITION CALCULATION ─────────────────────────────────────
// Méthode du coût moyen pondéré (CMP) — même méthode qu'AMF/FIFO simplifié
function computePositions() {
  const map = {};

  // Traiter dans l'ordre chronologique pour le CMP
  const sorted = [...S.transactions].sort(
    (a, b) => new Date(a.transaction_date) - new Date(b.transaction_date)
  );

  for (const tx of sorted) {
    const k = tx.ticker;
    if (!map[k]) map[k] = {
      ticker:      tx.ticker,
      name:        tx.name,
      asset_type:  tx.asset_type,
      quantity:    0,
      totalCostEur: 0,   // coût total en EUR
      accounts:    [],
      currency:    tx.currency  // devise "naturelle" de l'actif
    };

    const p     = map[k];
    const toEur = (v) => tx.currency === 'USD' ? v / S.eurUsd : v;
    const acctName = tx.accounts?.name || '—';
    if (!p.accounts.includes(acctName)) p.accounts.push(acctName);

    if (tx.transaction_type === 'buy') {
      p.totalCostEur += tx.quantity * toEur(tx.price) + toEur(tx.fees || 0);
      p.quantity     += tx.quantity;
    } else {
      // Vente : réduire le coût proportionnellement (CMP)
      const pruEur    = p.quantity > 0 ? p.totalCostEur / p.quantity : 0;
      p.totalCostEur -= tx.quantity * pruEur;
      p.quantity     -= tx.quantity;
    }
  }

  return Object.values(map)
    .filter(p => p.quantity > 0.000001)
    .map(p => ({ ...p, pruEur: p.totalCostEur / p.quantity }));
}

async function fetchAndDisplay(positions) {
  const pricePromises = positions.map(async (p) => {
    try {
      // Use cached price if recent (< 60s)
      let d = S.prices[p.ticker];
      if (!d || (Date.now() - (d._ts || 0)) > 60000) {
        const r = await fetch(`${API}?symbol=${encodeURIComponent(p.ticker)}`);
        d = await r.json();
        d._ts = Date.now();
        S.prices[p.ticker] = d;
      }
      if (!d.price) return;

      const isUsd   = (d.currency || 'USD') === 'USD';
      const priceEur = isUsd ? d.price / S.eurUsd : d.price;
      const valueEur = priceEur * p.quantity;
      const pnlEur   = valueEur - p.totalCostEur;
      const pnlPct   = p.totalCostEur > 0 ? (pnlEur / p.totalCostEur) * 100 : 0;
      const chgPct   = d.changePct ?? 0;

      // Store for KPI + chart
      p.priceEur = priceEur;
      p.valueEur = valueEur;
      p.pnlEur   = pnlEur;
      p.pnlPct   = pnlPct;

      // Price cell
      const priceEl = document.getElementById(`price-${p.ticker}`);
      if (priceEl) priceEl.innerHTML = `
        <span class="mono">${isUsd ? '$' : '€'}${fmtNum(d.price)}</span>
        <div style="font-size:11px;color:${chgPct >= 0 ? 'var(--green)' : 'var(--red)'};margin-top:2px">
          ${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}%
        </div>`;

      // Value
      const valEl = document.getElementById(`value-${p.ticker}`);
      if (valEl) valEl.innerHTML = `<span class="mono">${fmtEur(valueEur)}</span>`;

      // P&L €
      const pnlEl = document.getElementById(`pnl-${p.ticker}`);
      if (pnlEl) pnlEl.innerHTML = `
        <span class="mono ${pnlEur >= 0 ? 'c-green' : 'c-red'}">
          ${pnlEur >= 0 ? '+' : ''}${fmtEur(pnlEur)}
        </span>`;

      // P&L %
      const pnlpEl = document.getElementById(`pnlp-${p.ticker}`);
      if (pnlpEl) pnlpEl.innerHTML = `
        <span class="mono ${pnlPct >= 0 ? 'c-green' : 'c-red'}">
          ${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%
        </span>`;

    } catch {}
  });

  await Promise.all(pricePromises);
  updateKPIs(positions);
  renderDonut(positions);
}

function updateKPIs(positions) {
  const loaded   = positions.filter(p => p.valueEur != null);
  const totVal   = loaded.reduce((s, p) => s + p.valueEur, 0);
  const totCost  = positions.reduce((s, p) => s + p.totalCostEur, 0);
  const totPnl   = totVal - totCost;
  const totPnlPct = totCost > 0 ? (totPnl / totCost) * 100 : 0;
  const sign     = v => v >= 0 ? '+' : '';

  document.getElementById('kpi-grid').innerHTML = [
    {
      label: 'Valeur totale',
      value: fmtEur(totVal),
      sub:   `sur ${fmtEur(totCost)} investis`
    },
    {
      label: 'Montant investi',
      value: fmtEur(totCost),
      sub:   `${positions.length} position${positions.length > 1 ? 's' : ''}`
    },
    {
      label: 'Plus-value latente',
      value: `<span class="${totPnl >= 0 ? 'c-green' : 'c-red'}">${sign(totPnl)}${fmtEur(totPnl)}</span>`,
      sub:   `<span class="badge ${totPnl >= 0 ? 'badge-green' : 'badge-red'}">${sign(totPnlPct)}${totPnlPct.toFixed(2)}%</span>`
    },
    {
      label: 'Performance (simple)',
      value: `<span class="${totPnlPct >= 0 ? 'c-green' : 'c-red'}" style="font-size:28px">${sign(totPnlPct)}${totPnlPct.toFixed(2)}%</span>`,
      sub:   loaded.length < positions.length
               ? `<span style="color:var(--yellow)">⚠ ${positions.length - loaded.length} prix manquant${positions.length - loaded.length > 1 ? 's' : ''}</span>`
               : 'vs prix de revient moyen'
    }
  ].map(k => `
    <div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');
}

function renderDonut(positions) {
  const canvas = document.getElementById('donut-chart');
  if (!canvas) return;
  const pos = positions.filter(p => (p.valueEur || 0) > 0);
  const total = pos.reduce((s, p) => s + p.valueEur, 0);
  if (!total) return;
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  const COLORS = ['#5b7ef5','#8b5cf6','#22c55e','#f59e0b','#ef4444','#06b6d4','#ec4899','#f97316','#10b981','#a78bfa'];
  S.chart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: pos.map(p => p.ticker),
      datasets: [{
        data:            pos.map(p => p.valueEur),
        backgroundColor: pos.map((_, i) => COLORS[i % COLORS.length]),
        borderWidth:     0, hoverOffset: 6
      }]
    },
    options: {
      cutout: '70%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = ((ctx.raw / total) * 100).toFixed(1);
              return ` ${ctx.label}  ${fmtEur(ctx.raw)}  (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

async function saveAccount() {
  const name = document.getElementById('m-name').value.trim();
  const type = document.getElementById('m-type').value;
  const currency = document.getElementById('m-curr').value;
  if (!name) return showToast('❌ Donne un nom au compte');
  const { data, error } = await db.from('accounts')
    .insert({ user_id: S.user.id, name, type, currency }).select().single();
  if (error) return showToast('❌ ' + error.message);
  S.accounts.push(data);
  closeModal();
  showToast('✅ Compte créé');
  renderAccounts();
}

async function deleteAccount(id, name) {
  if (!confirm(`Supprimer "${name}" et toutes ses transactions ? Cette action est irréversible.`)) return;
  const { error } = await db.from('accounts').delete().eq('id', id);
  if (error) return showToast('❌ ' + error.message);
  S.accounts = S.accounts.filter(a => a.id !== id);
  S.transactions = S.transactions.filter(t => t.account_id !== id);
  showToast('✅ Compte supprimé');
  renderAccounts();
}

    <div class="form-group">
      <label class="form-label">Date *</label>
      <input type="date" id="m-date" class="form-input" value="${new Date().toISOString().split('T')[0]}">
    </div>

    <div class="form-group">
      <label class="form-label">Notes (optionnel)</label>
      <input type="text" id="m-notes" class="form-input" placeholder="ex: DCA mensuel, conviction long terme…">
    </div>

    <div class="tx-total-box" id="tx-total">
      Remplis la quantité et le prix pour voir le montant total.
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveTransaction()">Enregistrer</button>
    </div>`);
}

function updateTxTotal() {
  const qty  = parseFloat(document.getElementById('m-qty')?.value) || 0;
  const price = parseFloat(document.getElementById('m-price')?.value) || 0;
  const fees  = parseFloat(document.getElementById('m-fees')?.value) || 0;
  const curr  = document.getElementById('m-currency')?.value || 'EUR';
  const sym   = currSym(curr);
  const total = qty * price + fees;
  const el = document.getElementById('tx-total');
  if (el && qty > 0 && price > 0) {
    el.innerHTML = `<strong>Total : ${fmtNum(total)} ${sym}</strong>
      &nbsp;·&nbsp; ${fmtQty(qty)} × ${fmtNum(price)} ${sym} + ${fmtNum(fees)} ${sym} frais`;
  }
}

async function saveTransaction() {
  const account_id       = document.getElementById('m-acct').value;
  const ticker           = document.getElementById('m-ticker').value.trim().toUpperCase();
  const name             = document.getElementById('m-aname').value.trim();
  const asset_type       = document.getElementById('m-asset').value;
  const transaction_type = document.getElementById('m-txtype').value;
  const quantity         = parseFloat(document.getElementById('m-qty').value);
  const price            = parseFloat(document.getElementById('m-price').value);
  const fees             = parseFloat(document.getElementById('m-fees').value) || 0;
  const currency         = document.getElementById('m-currency').value;
  const transaction_date = document.getElementById('m-date').value;
  const notes            = document.getElementById('m-notes').value.trim() || null;

  if (!ticker || !name || !quantity || !price || !transaction_date) {
    return showToast('❌ Remplis les champs obligatoires (*)');
  }

  const { data, error } = await db.from('transactions')
    .insert({ account_id, ticker, name, asset_type, transaction_type, quantity, price, fees, currency, transaction_date, notes })
    .select('*, accounts(name, type)').single();

  if (error) return showToast('❌ ' + error.message);
  S.transactions.unshift(data);
  closeModal();
  showToast('✅ Transaction enregistrée');
  renderAccounts();
}

async function deleteTransaction(id) {
  if (!confirm('Supprimer cette transaction ?')) return;
  const { error } = await db.from('transactions').delete().eq('id', id);
  if (error) return showToast('❌ ' + error.message);
  S.transactions = S.transactions.filter(t => t.id !== id);
  showToast('✅ Transaction supprimée');
  renderAccounts();
}

// ── MODAL HELPERS ────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── FORMAT HELPERS ───────────────────────────────────────────
function fmtEur(v) {
  if (v == null || isNaN(v)) return '—';
  return v.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
}
function fmtNum(v) {
  if (v == null || isNaN(v)) return '—';
  return v.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtQty(v) {
  if (v == null) return '—';
  return Number.isInteger(v) ? v.toString()
    : v.toLocaleString('fr-FR', { maximumFractionDigits:6, minimumFractionDigits:0 });
}
function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function currSym(c) {
  return { EUR:'€', USD:'$', GBP:'£', JPY:'¥', HKD:'HK$', CHF:'CHF' }[c] || c;
}
function shortAcct(name) {
  // "CTO Trade Republic" → "CTO TR", "PEA BoursoBank" → "PEA BB"
  const words = name.split(' ');
  if (words.length <= 1) return name;
  return words[0] + ' ' + words.slice(1).map(w => w[0]).join('');
}

// ── TOAST ────────────────────────────────────────────────────
function showToast(msg, duration = 3500) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), duration);
}
</script>
